spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: USER-SERVICE
              uri: lb://USER-SERVICE
              predicates:
                - Path=/users/**,/auth/**
            - id: USER-SERVICE-APIDOCS
              uri: lb://USER-SERVICE
              predicates:
                - Path=/v3/api-docs/user-service
              filters:
                - RewritePath=/v3/api-docs/user-service, /v3/api-docs

            - id: NOTIFICATION-SERVICE
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/notifications/**
            - id: NOTIFICATION-SERVICE-APIDOCS
              uri: lb://NOTIFICATION-SERVICE
              predicates:
                - Path=/v3/api-docs/notification-service
              filters:
                - RewritePath=/v3/api-docs/notification-service,/v3/api-docs

            - id: PATIENT-SERVICE
              uri: lb://PATIENT-SERVICE
              predicates:
                - Path=/patient/**,/appointment/**,/doctor-slot/**
            - id: PATIENT-SERVICE-APIDOCS
              uri: lb://PATIENT-SERVICE
              predicates:
                - Path=/v3/api-docs/patient-service
              filters:
                - RewritePath=/v3/api-docs/patient-service,/v3/api-docs

            - id: PHARMACY-SERVICE
              uri: lb://PHARMACY-SERVICE
              predicates:
                - Path=/medicines/**,/dispense/**
            - id: PHARMACY-SERVICE-APIDOCS
              uri: lb://PHARMACY-SERVICE
              predicates:
                - Path=/v3/api-docs/pharmacy-service
              filters:
                - RewritePath=/v3/api-docs/pharmacy-service,/v3/api-docs

            - id: LAB-SERVICE
              uri: lb://LAB-SERVICE
              predicates:
                - Path=/lab-tests/**
            - id: LAB-SERVICE-APIDOCS
              uri: lb://LAB-SERVICE
              predicates:
                - Path=/v3/api-docs/lab-service
              filters:
                - RewritePath=/v3/api-docs/lab-service,/v3/api-docs

            - id: PRESCRIPTION-SERVICE
              uri: lb://PRESCRIPTION-SERVICE
              predicates:
                - Path=/doctors/**,/prescriptions/**
            - id: PRESCRIPTION-SERVICE-APIDOCS
              uri: lb://PRESCRIPTION-SERVICE
              predicates:
                - Path=/v3/api-docs/prescription-service
              filters:
                - RewritePath=/v3/api-docs/prescription-service,/v3/api-docs

            - id: BILLING-SERVICE
              uri: lb://BILLING-SERVICE
              predicates:
                - Path=/invoice/**,/mediclaim/**,/payment/**
            - id: BILLING-SERVICE-APIDOCS
              uri: lb://BILLING-SERVICE
              predicates:
                - Path=/v3/api-docs/billing-service
              filters:
                - RewritePath=/v3/api-docs/billing-service,/v3/api-docs

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

server:
  port: 8090

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970cygsgcicgueknkehcigeigsikcgukgcaugkceskygcgcskchaku

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: user-service
        url: /v3/api-docs/user-service
      - name: notification-service
        url: /v3/api-docs/notification-service
      - name: patient-service
        url: /v3/api-docs/patient-service
      - name: pharmacy-service
        url: /v3/api-docs/pharmacy-service
      - name: lab-service
        url: /v3/api-docs/lab-service
      - name: prescription-service
        url: /v3/api-docs/prescription-service
      - name: billing-service
        url: /v3/api-docs/billing-service