spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
              - id: USER-SERVICE
                uri: lb://USER-SERVICE
                predicates:
                  - Path=/users/**,/auth/**

              - id: NOTIFICATION-SERVICE
                uri: lb://NOTIFICATION-SERVICE
                predicates:
                  - Path=/notifications/**

              - id: PATIENT-SERVICE
                uri: lb://PATIENT-SERVICE
                predicates:
                  - Path=/patient/**,/appointment/**,/doctor-slot/**

              - id: PHARMACY-SERVICE
                uri: lb://PHARMACY-SERVICE
                predicates:
                  - Path=/medicines/**,/dispense/**

              - id: LAB-SERVICE
                uri: lb://LAB-SERVICE
                predicates:
                  - Path=/lab-tests/**

              - id: PRESCRIPTION-SERVICE
                uri: lb://PRESCRIPTION-SERVICE
                predicates:
                  - Path=/doctors/**,/prescriptions/**

              - id: BILLING-SERVICE
                uri: lb://BILLING-SERVICE
                predicates:
                  - Path=/invoice/**,/mediclaim/**,/payment/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

server:
  port: 8090

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

