server:
  port: 8083

spring:
  application:
    name: PRESCRIPTION-SERVICE

  datasource:
    url: jdbc:mysql://localhost:3306/hospital_prescription_db
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  cloud:
    config:
      enabled: false

eureka:
  client:
    enabled: false
    service-url:
      defaultZone: http://localhost:8761/eureka/